    <script>
      (function() {
        if (typeof window !== 'undefined') {
          if ('ResizeObserver' in window) {
            var NativeResizeObserver = window.ResizeObserver;
            window.ResizeObserver = function SafeResizeObserver(callback) {
              return new NativeResizeObserver(function(entries, observer) {
                window.requestAnimationFrame(function() {
                  callback(entries, observer);
                });
              });
            };
            window.ResizeObserver.prototype = NativeResizeObserver.prototype;
          }

          function isResizeError(msg) {
            return typeof msg === 'string' && (
              msg.indexOf('ResizeObserver loop completed with undelivered notifications') !== -1 ||
              msg.indexOf('ResizeObserver loop limit exceeded') !== -1 ||
              msg.indexOf('ResizeObserver') !== -1
            );
          }

          window.addEventListener('error', function(event) {
            var msg = event.message || (event.error && event.error.message);
            if (isResizeError(msg)) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            var msg = (event.reason && event.reason.message) || String(event.reason || '');
            if (isResizeError(msg)) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return true;
            }
          }, true);

          var origOnError = window.onerror;
          window.onerror = function(message, source, lineno, colno, error) {
            var msg = (typeof message === 'string') ? message : (error && error.message);
            if (isResizeError(msg)) {
              return true;
            }
            if (typeof origOnError === 'function') {
              return origOnError.apply(this, arguments);
            }
            return false;
          };
        }
      })();
    </script>
